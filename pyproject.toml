[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shardcairn"
version = "0.1.0"
description = "Bounded offline setup-aware CI shard planning with independent verification"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ShardCairn contributors"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent"]

[project.scripts]
shardcairn = "shardcairn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shardcairn = ["schemas/*.json", "py.typed"]
